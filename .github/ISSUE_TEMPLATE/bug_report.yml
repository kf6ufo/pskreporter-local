name: Bug report
description: Report reproducible behavior that appears incorrect
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include security vulnerabilities or private station data here; use the repository's private vulnerability reporting form for security concerns.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the release, commit SHA, or approximate checkout date.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, Python version, and browser.
      placeholder: Windows 11, Python 3.13, Firefox 142
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Start the application with...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact callsigns, contact details, paths, ADIF data, and credentials as needed.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed information I do not want to make public.
          required: true
        - label: I agree to follow the project's Code of Conduct.
          required: true
