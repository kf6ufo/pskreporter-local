name: Feature request
description: Suggest a focused improvement to the project
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or operating need
      description: Describe the need this proposal would address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the behavior or workflow you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other approaches you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, sketches, or links that clarify the request.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: I agree to follow the project's Code of Conduct.
          required: true
